name: Deploy DevMarket Production on Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  build_and_deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        env:
          PORT: 5000
          BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.PROD_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.PROD_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.PROD_VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.PROD_VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Missing Actions secret PROD_VITE_FIREBASE_API_KEY"; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "::error::Missing Actions secret PROD_VITE_FIREBASE_AUTH_DOMAIN"; exit 1; }
          test "$VITE_FIREBASE_PROJECT_ID" = "dev-market0" || { echo "::error::PROD_VITE_FIREBASE_PROJECT_ID must be dev-market0"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "::error::Missing Actions secret PROD_VITE_FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::Missing Actions secret PROD_VITE_FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "::error::Missing Actions secret PROD_VITE_FIREBASE_APP_ID"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing Actions secret VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing Actions secret VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          pnpm run build


      - name: Deploy to Firebase Hosting production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT }}
          projectId: dev-market0
          channelId: live
          target: production
