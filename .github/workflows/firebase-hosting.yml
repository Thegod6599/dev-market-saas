name: Deploy DevMarket Test

on:
  push:
    branches:
      - codex/standalone-component-packages

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Missing Actions secret VITE_FIREBASE_API_KEY"; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "::error::Missing Actions secret VITE_FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "::error::Missing Actions secret VITE_FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_APP_ID"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing Actions secret VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing Actions secret VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          pnpm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
