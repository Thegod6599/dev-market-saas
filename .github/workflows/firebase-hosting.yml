name: Deploy DevMarket Test

on:
  push:
    branches:
      - codex/standalone-component-packages

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Missing Actions secret VITE_FIREBASE_API_KEY"; exit 1; }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || { echo "::error::Missing Actions secret VITE_FIREBASE_AUTH_DOMAIN"; exit 1; }
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_PROJECT_ID"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "::error::Missing Actions secret VITE_FIREBASE_STORAGE_BUCKET"; exit 1; }
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_MESSAGING_SENDER_ID"; exit 1; }
          test -n "$VITE_FIREBASE_APP_ID" || { echo "::error::Missing Actions secret VITE_FIREBASE_APP_ID"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing Actions secret VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing Actions secret VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          pnpm run build

          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';

          const outputDirectory = 'public/dist/public';
          const expected = [
            ['VITE_SUPABASE_URL', process.env.VITE_SUPABASE_URL],
            ['VITE_SUPABASE_PUBLISHABLE_KEY', process.env.VITE_SUPABASE_PUBLISHABLE_KEY],
          ];

          async function collectJavaScript(directory) {
            const files = await readdir(directory, { withFileTypes: true });
            const contents = await Promise.all(files.map(async (file) => {
              const filePath = path.join(directory, file.name);
              if (file.isDirectory()) return collectJavaScript(filePath);
              return file.name.endsWith('.js') ? readFile(filePath, 'utf8') : '';
            }));
            return contents.flat(Infinity).join('\n');
          }

          const bundle = await collectJavaScript(path.join(outputDirectory, 'assets'));
          if (!(await readFile(path.join(outputDirectory, 'index.html'), 'utf8'))) {
            throw new Error('Firebase Hosting build output is missing index.html.');
          }
          for (const [name, value] of expected) {
            if (!value || !bundle.includes(value)) {
              throw new Error(`The production bundle does not contain configured ${name}.`);
            }
          }
          console.log('Verified Supabase client configuration in the Firebase Hosting build output.');
          NODE

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
